# scrat
# Release management tooling focused on sanity retention
# https://github.com/claylo/scrat
[project]
type = "generic"    # bash project — version bump and publish are manual

[commands]
test = "no tests configured"

[[version_files]]
path = ".claude-plugin/plugin.json"
format = "json"
field = "version"

[[version_files]]
path = ".claude-plugin/marketplace.json"
format = "json"
fields = ["metadata.version", "plugins.*.version"]

[[version_files]]
path = "skills/*/SKILL.md"
format = "frontmatter"
field = "metadata.version"

[[version_files]]
path = "package.json"
format = "json"
field = "version"
